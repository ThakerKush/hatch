services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: hatch
      POSTGRES_PASSWORD: hatch
      POSTGRES_DB: hatch
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hatch"]
      interval: 5s
      timeout: 3s
      retries: 5

  minio:
    image: minio/minio:latest
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"   # S3 API
      - "9001:9001"   # MinIO Console
    volumes:
      - miniodata:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 3s
      retries: 5

  # One-shot container that creates the snapshot bucket in MinIO.
  minio-init:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
        mc alias set local http://minio:9000 minioadmin minioadmin &&
        mc mb --ignore-existing local/hatch-snapshots &&
        echo 'Bucket ready'
      "

  hatch:
    build: .
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
    privileged: true          # required for Firecracker, TAP devices, bridges
    network_mode: host        # VMs need host networking for bridge/TAP
    environment:
      DATABASE_URL: "postgres://hatch:hatch@127.0.0.1:5432/hatch?sslmode=disable"
      HATCH_HTTP_ADDR: ":8080"
      HATCH_PROXY_ADDR: ":9090"
      HATCH_PROXY_BASE_DOMAIN: "hatch.local"
      HATCH_DATA_DIR: "/data"
      HATCH_S3_ENDPOINT: "http://127.0.0.1:9000"
      HATCH_S3_BUCKET: "hatch-snapshots"
      HATCH_S3_REGION: "us-east-1"
      HATCH_S3_ACCESS_KEY: "minioadmin"
      HATCH_S3_SECRET_KEY: "minioadmin"
      HATCH_FIRECRACKER_BIN: "/firecracker-data/firecracker"
      HATCH_DEFAULT_KERNEL_PATH: "/firecracker-data/vmlinux-5.10"
      HATCH_DEFAULT_ROOTFS_PATH: "/firecracker-data/ubuntu-noble.raw"
      HATCH_SSH_ALLOWED_CIDR: "0.0.0.0/0"
      HATCH_IDLE_TIMEOUT: "10m"
      HATCH_IDLE_CHECK_INTERVAL: "1m"
    volumes:
      - hatchdata:/data
      - /root/firecracker:/firecracker-data

volumes:
  pgdata:
  miniodata:
  hatchdata:
