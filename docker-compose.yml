services:
  traefik:
    image: traefik:v3.3
    restart: unless-stopped
    network_mode: host
    environment:
      CF_DNS_API_TOKEN: "${CF_DNS_API_TOKEN}"
    volumes:
      - letsencrypt:/letsencrypt
      - ./traefik/dynamic.yml:/etc/traefik/dynamic.yml:ro
    command:
      - "--providers.file.filename=/etc/traefik/dynamic.yml"
      - "--providers.file.watch=true"
      - "--entrypoints.web.address=:80"
      - "--entrypoints.websecure.address=:443"
      - "--entrypoints.web.http.redirections.entryPoint.to=websecure"
      - "--entrypoints.web.http.redirections.entryPoint.scheme=https"
      # Wildcard certs require DNS challenge (Cloudflare)
      - "--certificatesresolvers.letsencrypt.acme.email=${ACME_EMAIL}"
      - "--certificatesresolvers.letsencrypt.acme.storage=/letsencrypt/acme.json"
      - "--certificatesresolvers.letsencrypt.acme.dnschallenge=true"
      - "--certificatesresolvers.letsencrypt.acme.dnschallenge.provider=cloudflare"
      # Uncomment for staging certs while testing (avoids rate limits)
      # - "--certificatesresolvers.letsencrypt.acme.caserver=https://acme-staging-v02.api.letsencrypt.org/directory"

  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: "${POSTGRES_USER:-hatch}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:-hatch}"
      POSTGRES_DB: "${POSTGRES_DB:-hatch}"
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER}"]
      interval: 5s
      timeout: 3s
      retries: 5

  minio:
    image: minio/minio:latest
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: "${MINIO_ROOT_USER:-minioadmin}"
      MINIO_ROOT_PASSWORD: "${MINIO_ROOT_PASSWORD:-minioadmin}"
    ports:
      - "9000:9000"   # S3 API
      - "9001:9001"   # MinIO Console
    volumes:
      - miniodata:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 3s
      retries: 5

  minio-init:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
        mc alias set local http://minio:9000 $${MINIO_ROOT_USER} $${MINIO_ROOT_PASSWORD} &&
        mc mb --ignore-existing local/$${HATCH_S3_BUCKET} &&
        echo 'Bucket ready'
      "
    environment:
      MINIO_ROOT_USER: "${MINIO_ROOT_USER:-minioadmin}"
      MINIO_ROOT_PASSWORD: "${MINIO_ROOT_PASSWORD:-minioadmin}"
      HATCH_S3_BUCKET: "${HATCH_S3_BUCKET:-hatch-snapshots}"

  hatch:
    build: .
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
    privileged: true
    network_mode: host
    environment:
      DATABASE_URL: "${DATABASE_URL}"
      HATCH_HTTP_ADDR: "${HATCH_HTTP_ADDR}"
      HATCH_PROXY_ADDR: "${HATCH_PROXY_ADDR}"
      HATCH_PROXY_BASE_DOMAIN: "${HATCH_BASE_DOMAIN}"
      HATCH_DATA_DIR: "${HATCH_DATA_DIR}"
      HATCH_S3_ENDPOINT: "${HATCH_S3_ENDPOINT}"
      HATCH_S3_BUCKET: "${HATCH_S3_BUCKET}"
      HATCH_S3_REGION: "${HATCH_S3_REGION}"
      HATCH_S3_ACCESS_KEY: "${HATCH_S3_ACCESS_KEY}"
      HATCH_S3_SECRET_KEY: "${HATCH_S3_SECRET_KEY}"
      HATCH_FIRECRACKER_BIN: "${HATCH_FIRECRACKER_BIN}"
      HATCH_DEFAULT_KERNEL_PATH: "${HATCH_DEFAULT_KERNEL_PATH}"
      HATCH_DEFAULT_ROOTFS_PATH: "${HATCH_DEFAULT_ROOTFS_PATH}"
      HATCH_SSH_ALLOWED_CIDR: "${HATCH_SSH_ALLOWED_CIDR}"
      HATCH_IDLE_TIMEOUT: "${HATCH_IDLE_TIMEOUT}"
      HATCH_IDLE_CHECK_INTERVAL: "${HATCH_IDLE_CHECK_INTERVAL}"
    volumes:
      - hatchdata:/data
      - /root/firecracker:/firecracker-data

volumes:
  pgdata:
  miniodata:
  hatchdata:
  letsencrypt:
