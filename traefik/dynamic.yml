# Traefik dynamic config
# api.hatchvm.com  -> Hatch REST API (:8080)
# hatchvm.com      -> Next.js app    (:3000)
# *.hatchvm.com    -> Hatch VM proxy (:9090)  [agent subdomain catch-all]

http:
  routers:
    hatch-api:
      rule: "Host(`api.hatchvm.com`)"
      entryPoints:
        - websecure
      service: hatch-api
      priority: 100
      tls:
        certResolver: letsencrypt
        domains:
          - main: "*.hatchvm.com"

    hatch-web:
      rule: "Host(`hatchvm.com`) || Host(`www.hatchvm.com`)"
      entryPoints:
        - websecure
      service: hatch-web
      priority: 50
      tls:
        certResolver: letsencrypt
        domains:
          - main: "hatchvm.com"
          - sans:
              - "www.hatchvm.com"

    hatch-vms:
      rule: "HostRegexp(`.+`)"
      entryPoints:
        - websecure
      service: hatch-proxy
      priority: 1
      tls:
        certResolver: letsencrypt
        domains:
          - main: "*.hatchvm.com"

  services:
    hatch-api:
      loadBalancer:
        servers:
          - url: "http://127.0.0.1:8080"

    hatch-proxy:
      loadBalancer:
        servers:
          - url: "http://127.0.0.1:9090"

    hatch-web:
      loadBalancer:
        servers:
          - url: "http://127.0.0.1:3000"
