# Traefik dynamic config
# api.hatchvm.com  -> Hatch REST API (:8080)
# *.hatchvm.com    -> Hatch VM proxy (:9090)

http:
  routers:
    hatch-api:
      rule: "Host(`api.hatchvm.com`)"
      entryPoints:
        - websecure
      service: hatch-api
      priority: 100
      tls:
        certResolver: letsencrypt
        domains:
          - main: "hatchvm.com"
            sans:
              - "*.hatchvm.com"

    hatch-vms:
      rule: "HostRegexp(`.+`)"
      entryPoints:
        - websecure
      service: hatch-proxy
      priority: 1
      tls:
        certResolver: letsencrypt

  services:
    hatch-api:
      loadBalancer:
        servers:
          - url: "http://127.0.0.1:8080"

    hatch-proxy:
      loadBalancer:
        servers:
          - url: "http://127.0.0.1:9090"
